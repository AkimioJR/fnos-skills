name: Lint Python

on:
  push:
    paths:
      - "scripts/**/*.py"
      - ".github/workflows/lint-python.yml"
  pull_request:
    paths:
      - "scripts/**/*.py"
      - ".github/workflows/lint-python.yml"
  workflow_dispatch:

concurrency:
  group: lint-python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Ruff check
        run: uv run --with ruff ruff check scripts/

      - name: Create lint environment
        run: |
          uv venv .venv-lint
          uv pip install --python .venv-lint/bin/python httpx ty

      - name: ty check
        run: .venv-lint/bin/ty check --python .venv-lint/bin/python scripts/
