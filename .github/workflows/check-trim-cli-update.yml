name: Check trim-cli update

on:
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch:

concurrency:
  group: trim-cli-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Ruff check
        run: uv run --with ruff ruff check scripts/

      - name: Create lint environment
        run: |
          uv venv .venv-lint
          uv pip install --python .venv-lint/bin/python httpx ty

      - name: ty check
        run: .venv-lint/bin/ty check --python .venv-lint/bin/python scripts/

  update:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Update skill from npm
        id: update
        # 脚本把结果 JSON 打到 stdout、诊断日志走 stderr；
        # 这里重定向 stdout 到文件，再用 jq 解析出各字段
        run: |
          uv run scripts/update_skill.py --update > result.json
          HAS_UPDATE=$(jq -r '.has_update' result.json)
          {
            echo "has_update=${HAS_UPDATE}"
            if [ "${HAS_UPDATE}" = "true" ]; then
              echo "version=$(jq -r '.version' result.json)"
              echo "tarball_url=$(jq -r '.tarball_url' result.json)"
              echo "integrity=$(jq -r '.integrity' result.json)"
              echo "tarball_sha256=$(jq -r '.tarball_sha256' result.json)"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.update.outputs.has_update == 'true'
        env:
          VERSION: ${{ steps.update.outputs.version }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add skills/trim-cli
          git commit -m "update(trim-cli): version: v${VERSION}"

          TAG_NAME="trim-cli-v${VERSION}"
          git tag -a "${TAG_NAME}" -m "trim-cli v${VERSION}"
          git push origin HEAD:main
          git push origin "${TAG_NAME}"

      - name: Package assets
        if: steps.update.outputs.has_update == 'true'
        run: |
          mkdir dist
          cp skills/trim-cli/manifest.json dist/manifest.json
          (cd skills && zip -qr "../dist/trim-cli-skill.zip" trim-cli)
          cat > dist/notes.md <<EOF
          ## trim-cli v${{ steps.update.outputs.version }}

          Synced from npm package [@trimjs/trim-cli](https://www.npmjs.com/package/@trimjs/trim-cli).

          - npm tarball: ${{ steps.update.outputs.tarball_url }}
          - registry integrity: ${{ steps.update.outputs.integrity }}
          - tarball sha256: ${{ steps.update.outputs.tarball_sha256 }}

          版本与完整性校验均以 npm registry 为准。
          EOF

      - name: Create release
        uses: softprops/action-gh-release@v3
        if: steps.update.outputs.has_update == 'true'
        with:
          tag_name: trim-cli-v${{ steps.update.outputs.version }}
          name: trim-cli v${{ steps.update.outputs.version }}
          body_path: dist/notes.md
          files: |
            dist/trim-cli-skill.zip
            dist/manifest.json
            skills/trim-cli/bin/*

      - name: Clean up
        if: always()
        run: rm -f result.json
